services:
  db:
    image: postgres:16-alpine
    container_name: price-tracker-db
    environment:
      POSTGRES_USER: price-tracker
      POSTGRES_PASSWORD: price-tracker
      POSTGRES_DB: price-tracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price-tracker -d price-tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
